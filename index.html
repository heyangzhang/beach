<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is Ivan at the Pool?</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
            transition: background-color 0.3s ease;
        }

        .open {
            background: #4CAF50;
            color: white;
        }

        .closed {
            background: #F44336;
            color: white;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
        }

        .note {
            margin-top: 1rem;
            font-size: 1.2rem;
        }

        .updated {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1 id="status">Loading...</h1>
    <div class="note" id="note"></div>
    <div class="updated" id="updated"></div>

    <script>
        async function loadStatus() {
            try {
                const response = await fetch('./status.json?v=' + Date.now());
                const data = await response.json();

                const statusElement = document.getElementById('status');

                const noteElement = document.getElementById('note');

                if (data.status === 'open') {
                    document.body.className = 'open';
                    statusElement.textContent = 'YES';
                    noteElement.textContent = 'Come Join Him';
                } else {
                    document.body.className = 'closed';
                    statusElement.textContent = 'NO';
                    noteElement.textContent = 'But He Is Probably Thinking About Going';
                }

                document.getElementById('note').textContent =
                    data.note || '';

                document.getElementById('updated').textContent =
                    `Last updated: ${new Date(data.updatedAt).toLocaleString()}`;

            } catch (error) {
                document.body.className = 'closed';
                document.getElementById('status').textContent = 'ERROR';
                console.error(error);
            }
        }

        loadStatus();
    </script>

</body>
</html>
